<div class="navbar navbar-default sb-header"
     role="navigation">
    <div class="container">

        <!-- Collapsed navigation -->
        <div class="navbar-header">
            <!-- Expander button -->
            <button type="button"
                    class="navbar-toggle"
                    data-toggle="collapse"
                    data-target=".navbar-collapse">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <!-- Main title -->
            <a class="navbar-brand"
               href="/"><img src="/img/logo.png"/></a>
        </div>

        <!-- Expanded navigation -->
        <div class="navbar-collapse collapse"
             style="padding-bottom: 20px;">
            <!-- Main navigation -->
            <ul class="nav navbar-nav sb-nav">
                {% for nav_item in nav %}
                    {% if nav_item.children %}
                    <li class="dropdown{% if nav_item.active %} active{% endif %} sb-item {{ nav_item.title }}">
                        <a href="#" class="dropdown-toggle"
                           data-toggle="dropdown">{{ nav_item.title }} <b class="caret"></b></a>
                        <ul class="dropdown-menu sb-radius">
                            {% for nav_item in nav_item.children %}
                                <li {% if nav_item.active %}class="active"{% endif %}>
                                    <a href="{% if not nav_item.is_section %}{{ nav_item.url|url }}{% else %}#{% endif %}">{{ nav_item.title }}</a>
                                </li>
                            {% endfor %}
                        </ul>
                    </li>
                    {% else %}
                        <li class="{% if nav_item.active %}active{% endif %} sb-item">
                            <a href="{% if not nav_item.is_section %}{{ nav_item.url|url }}{% else %}#{% endif %}">{{ nav_item.title }}</a>
                        </li>
                    {% endif %}
                {% endfor %}
            </ul>


        </div>
    </div>

    <div style="clear:both;"></div>
</div>

{%- if 'search' in config['plugins'] %}
<div class="sb-searchbar hidden-print">
    <div class="container">
        <form class="sb-nav-search" onsubmit="return false;" role="search">
            <i class="fa fa-search"></i>
            <input type="text" id="sb-nav-search" placeholder="Search the documentation: push, hooks, Dialog, feature.json..." autocomplete="off" aria-label="Search the documentation">
            <kbd>/</kbd>
        </form>
    </div>
</div>
{%- endif %}
